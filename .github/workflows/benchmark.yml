name: Benchmark

# Regular timeline benchmark run. Triggered on push to `timeline` (usually
# from merging a detect-releases PR) plus manual dispatch and a weekly
# safety-net cron. Walks all synthetic commits on the current branch in
# order and runs each under asv with --skip-existing-successful, so any
# already-measured commit is a no-op. Publishes to gh-pages after each
# commit so partial progress is durable — if the install hook breaks on
# one pymc version, everything before it is still visible on the
# dashboard.

on:
  push:
    branches: [timeline]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true  # pymc-<ver> tags feed asv's x-axis labels

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            versions/tracked_versions.json
            asv_bench/_provision.py

      - name: Install asv
        run: |
          uv tool install asv
          pip install pyyaml packaging

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Overlay main onto working tree
        run: |
          # The walk runs asv against the host working tree, which on
          # a push-to-timeline trigger sits on the timeline branch. If
          # timeline's base predates changes on main (new workflows,
          # updated core list, refactored bench_models), the walk uses
          # stale code. Overlay every tracked file from origin/main so
          # asv discovers the current benchmark module + filter,
          # without rebasing timeline's commits (which would invalidate
          # all existing results by changing their SHAs).
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .

      - name: Register machine
        run: asv machine --yes --machine ci

      - name: Compute core benchmark filter
        id: filter
        run: echo "regex=$(python scripts/core_models.py)" >> "$GITHUB_OUTPUT"

      - name: Restore previous ASV results from gh-pages
        env:
          REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
        run: |
          set -euo pipefail
          rm -rf .gh-pages
          if git clone --quiet --branch gh-pages --depth 1 "$REMOTE" .gh-pages 2>/dev/null; then
            if [ -d .gh-pages/results ]; then
              mkdir -p .asv/results
              cp -a .gh-pages/results/. .asv/results/
            fi
          fi

      - name: Walk timeline commits, publishing after each
        env:
          BENCH: ${{ steps.filter.outputs.regex }}
          REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main
          base=$(git merge-base origin/main HEAD)
          commits=$(git rev-list --reverse "${base}..HEAD")
          if [ -z "$commits" ]; then
            echo "No synthetic commits to benchmark."
            exit 0
          fi

          rm -rf .gh-pages-push
          if ! git clone --quiet --branch gh-pages --depth 1 "$REMOTE" .gh-pages-push 2>/dev/null; then
            mkdir -p .gh-pages-push
            (cd .gh-pages-push && \
              git init -q -b gh-pages && \
              git remote add origin "$REMOTE")
          fi
          (cd .gh-pages-push && \
            git config user.name 'github-actions[bot]' && \
            git config user.email 'github-actions[bot]@users.noreply.github.com')

          # Track failures across the walk but never abort. Asv writes
          # results incrementally — when a single benchmark in a commit
          # crashes, the other 39 are still on disk and worth
          # publishing. See backfill.yml for the full rationale.
          failed_commits=""
          for sha in $commits; do
            short=$(git rev-parse --short=10 "$sha")
            echo "::group::benchmark $short"

            # Ensure this commit carries a pymc-<ver> tag so asv's x-axis
            # shows the version, not a bare SHA. backfill_history.py tags its
            # own synthetic commits, but a detect-releases PR merged into
            # timeline arrives untagged — derive the tag from the ledger's top
            # version at this commit. Idempotent: skips if already tagged, and
            # never aborts the walk (the tag is cosmetic).
            ver=$(git show "$sha:versions/tracked_versions.json" 2>/dev/null \
              | python -c "import json,sys;from packaging.version import Version;r=json.load(sys.stdin).get('minor_releases') or [];print(max(r,key=lambda e:Version(e['pymc']))['pymc'] if r else '')" \
              || true)
            if [ -n "$ver" ] && ! git rev-parse -q --verify "refs/tags/pymc-$ver" >/dev/null 2>&1; then
              git tag "pymc-$ver" "$sha" && new_tags=1
            fi

            if ! asv run -v --show-stderr --launch-method=spawn --skip-existing-successful --machine ci --bench "$BENCH" "${sha}^!"; then
              echo "::warning::commit $short had benchmark failures — publishing partial results"
              failed_commits="${failed_commits} ${short}"
            fi
            asv publish

            # Preserve .git and the experiments/ subtree (experiment.yml owns it).
            (cd .gh-pages-push && find . -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name experiments -exec rm -rf {} +)
            cp -a .asv/html/. .gh-pages-push/
            mkdir -p .gh-pages-push/results
            cp -a .asv/results/. .gh-pages-push/results/

            # Rebase onto any concurrent gh-pages update (e.g. an
            # experiment.yml push) so our push stays fast-forward. The
            # experiments/ subtree was excluded from the wipe above, so
            # there's nothing to conflict on.
            (cd .gh-pages-push && \
              git add -A && \
              (git commit -q -m "Publish timeline through $short" || echo "no changes") && \
              git pull --rebase --autostash -q origin gh-pages 2>/dev/null || true; \
              git push -q origin gh-pages)
            echo "::endgroup::"
          done

          if [ -n "$failed_commits" ]; then
            echo "::warning::commits with at least one failed benchmark:$failed_commits"
          fi

          # Publish any pymc-<ver> tags minted above so future runs (and the
          # asv x-axis) see them. Best-effort — a tag-push race must not fail
          # the benchmark run.
          if [ -n "${new_tags:-}" ]; then
            git push -q origin --tags 2>/dev/null || true
          fi

      - name: Regenerate custom dashboard
        if: always()
        env:
          REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
        run: |
          set -euo pipefail
          rm -rf .gh-pages-dash
          if ! git clone --quiet --branch gh-pages --depth 1 "$REMOTE" .gh-pages-dash; then
            echo "gh-pages not yet created — skipping dashboard regen"
            exit 0
          fi
          if [ ! -f .gh-pages-dash/index.json ]; then
            echo "no asv data on gh-pages — skipping dashboard regen"
            exit 0
          fi
          python scripts/make_dashboard.py .gh-pages-dash .gh-pages-dash/dashboard.html
          cd .gh-pages-dash
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "dashboard.html unchanged"
            exit 0
          fi
          git commit -q -m "Regenerate custom dashboard"
          git pull --rebase --autostash -q origin gh-pages 2>/dev/null || true
          git push -q origin gh-pages
