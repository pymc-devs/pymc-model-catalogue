name: Detect pymc releases

on:
  schedule:
    - cron: '23 7 * * *'  # daily
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Read (and branch the PR from) the populated `timeline` ledger,
          # not main's intentionally-empty one. bump_release.py appends only
          # releases newer than the ledger's max, so against timeline it
          # proposes at most the genuinely-new minor(s) instead of the entire
          # back-catalogue.
          ref: timeline
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install packaging
        run: pip install packaging

      - name: Bump ledger
        id: bump
        run: |
          python scripts/bump_release.py
          if git diff --quiet versions/tracked_versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: timeline
          commit-message: "Track new pymc minor release(s)"
          title: "Track new pymc minor release(s)"
          body: |
            Automated update of `versions/tracked_versions.json` from PyPI,
            branched from `timeline`. Merging appends the new pymc release to
            the benchmarked ledger; the push to `timeline` triggers
            `benchmark.yml`, which walks the new commit and adds one data
            point to the dashboard.
          branch: auto/track-pymc-release
          delete-branch: true
