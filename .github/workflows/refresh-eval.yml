name: Refresh eval timings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List affected timings without measuring or publishing"
        type: boolean
        default: false

# Share the push-to-timeline benchmark lock while replacing published results.
concurrency:
  group: benchmark-refs/heads/timeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.14

      - uses: astral-sh/setup-uv@v5

      - name: Install constrained ASV tools
        run: |
          constraints="$RUNNER_TEMP/asv-runner-constraints.txt"
          cp asv_bench/runner-constraints.txt "$constraints"
          uv tool install --force 'asv==0.6.6' --constraint "$constraints"
          echo "PIP_CONSTRAINT=$constraints" >> "$GITHUB_ENV"
          echo "UV_CONSTRAINT=$constraints" >> "$GITHUB_ENV"

      - name: Prepare timeline and saved results
        env:
          REMOTE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
        run: |
          set -euo pipefail
          git branch timeline origin/timeline
          asv machine --yes --machine ci
          git clone --quiet --branch gh-pages --depth 1 "$REMOTE" .gh-pages
          mkdir -p .asv/results
          cp -a .gh-pages/results/. .asv/results/

      - name: Refresh affected eval timings
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/refresh_eval.py "${args[@]}"

      - name: Publish verified replacements
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          asv publish
          # Fetch any experiment updates before assembling the complete site.
          git -C .gh-pages pull --ff-only -q origin gh-pages
          (cd .gh-pages && find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name experiments ! -name results -exec rm -rf {} +)
          cp -a .asv/html/. .gh-pages/
          cp -a .asv/results/. .gh-pages/results/
          python scripts/make_dashboard.py .gh-pages .gh-pages/dashboard.html
          if [ -d .gh-pages/experiments ]; then
            python scripts/make_experiment_dashboard.py .gh-pages .gh-pages/experiments.html
          fi
          cd .gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Refresh single-call eval timings"
          git pull --rebase -q origin gh-pages
          git push -q origin gh-pages
